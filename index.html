<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro de Registro de Nascimento - Pintinhos</title>
    <meta name="description" content="Sistema local para registro de nascimento e anilhamento de pintinhos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <header>
            <h1>Registro de Nascimento</h1>
            <p>Controle de Anilhamento e Vacinas de Pintinhos</p>
        </header>

        <main>
            <section class="glass-panel form-section">
                <h2 id="formTitle">Novo Registro</h2>
                <form id="registroForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nomeGalo">Nome do Galo (Pai)</label>
                            <input type="text" id="nomeGalo" required placeholder="Ex: Índio Gigante">
                        </div>
                        <div class="form-group">
                            <label for="anilhaGalo">Anilha do Galo</label>
                            <input type="text" id="anilhaGalo" required placeholder="Ex: 001">
                        </div>
                        <div class="form-group">
                            <label for="nomeGalinha">Nome da Galinha (Mãe)</label>
                            <input type="text" id="nomeGalinha" required placeholder="Ex: Carijó">
                        </div>
                        <div class="form-group">
                            <label for="anilhaGalinha">Anilha da Galinha</label>
                            <input type="text" id="anilhaGalinha" required placeholder="Ex: 002">
                        </div>
                        <div class="form-group">
                            <label for="dataNascimento">Data de Nascimento</label>
                            <input type="date" id="dataNascimento" required>
                        </div>
                        <div class="form-group">
                            <label for="anilhaPintinho">Anilha do Pintinho</label>
                            <input type="text" id="anilhaPintinho" required placeholder="Ex: P-001">
                        </div>
                        <div class="form-group full-width">
                            <label for="vacinas">Vacinas Aplicadas</label>
                            <input type="text" id="vacinas" placeholder="Ex: Marek, Bouba Aviária, Newcastle">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="btnSubmit" class="btn-submit">Salvar Registro</button>
                        <button type="button" id="btnCancel" class="btn-cancel" style="display: none;">Cancelar</button>
                    </div>
                </form>
            </section>

            <section class="glass-panel table-section">
                <h2>Registros Salvos</h2>
                <div class="table-responsive">
                    <table id="registrosTable">
                        <thead>
                            <tr>
                                <th>Data Nasc.</th>
                                <th>Anilha Pintinho</th>
                                <th>Galo (Anilha)</th>
                                <th>Galinha (Anilha)</th>
                                <th>Vacinas</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="registrosBody">
                            <!-- Records will be injected here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
